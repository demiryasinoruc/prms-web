server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Server-level security headers (location block'unda add_header yoksa inherit edilir)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS: TLS reverse proxy arkasinda calisirken anlamlidir; plain HTTP'de
    # tarayici tarafindan yok sayilir (zararsiz).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # NOT (CSP): Content-Security-Policy eklemek icin API domain'i bilinmeli.
    # Ornek sablon (API + SignalR wss + OSM tile'lari):
    #   add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' https://API_DOMAIN wss://API_DOMAIN; style-src 'self' 'unsafe-inline'; script-src 'self'" always;

    # Hashed asset'ler için 1 yıl cache (Vite content hash kullanır).
    # nginx davranışı: bu block içinde add_header varsa, server-level header'lar
    # inherit EDİLMEZ — hepsini tekrar yazmak gerekir.
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # index.html için no-cache (yeni deployment hemen görünür olsun).
    # Aynı nedenle tüm güvenlik header'ları tekrar yazılır.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # SPA fallback: bilinmeyen path'ler index.html'e
    # (bu block'ta add_header yok → server-level header'lar inherit edilir,
    # ancak internal redirect /index.html'e gittiği için final header'lar yukarıdaki
    # /index.html block'undan gelir.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
