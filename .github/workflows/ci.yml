name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Typecheck + Build
        run: npm run build
        env:
          # CI doğrulama build'i — deploy edilmez (vite.config localhost uyarısı basar)
          VITE_API_URL: https://localhost:7118
